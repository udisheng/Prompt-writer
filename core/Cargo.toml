[package]
name = "rewriter-core"
version = "0.1.0"
description = "Prompt rewrite pipeline for Prompt Rewriter"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
include_dir = "0.7"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
